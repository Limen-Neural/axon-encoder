[package]
name = "axon-encoder"
version = "0.7.0"
# Kept for cargo metadata / CARGO_PKG_AUTHORS. crates.io UI lists the
# publishing account instead of this field (RFC 3052).
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
description = "Flexible sensory encoding pipelines for spiking neural networks — rate, temporal, predictive, population, and neuromodulator-driven encoding for telemetry and cyber-physical data."
repository = "https://github.com/Limen-Neural/axon-encoder"
homepage = "https://github.com/Limen-Neural/axon-encoder"
documentation = "https://docs.rs/axon-encoder"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2024"
# True measured MSRV (let-chains in src/streaming.rs need 1.88; verified with
# `cargo +1.88.0 check --locked --all-targets --features serde,ndarray`).
# Intentionally lower than the dev toolchain pin — see REVIEW.md "MSRV vs
# dev-toolchain pin". The optional `nir` feature is floored higher by
# nir-rs's own rust-version (1.98.1 as of nir-rs 0.4.5), not by this crate.
rust-version = "1.88.0"
keywords = ["snn", "spiking", "neuromorphic", "encoding", "spike"]
categories = ["science", "algorithms", "simulation"]
# crates.io surface: keep licenses, README, sources, examples, and tests.
# Drop agent/CI/dev-only paths. Hidden git-tracked files still pack unless
# listed here (e.g. .gitignore).
exclude = [
    "/.agents/",
    "/.codacy.yml",
    "/.codecov.yml",
    "/.deepsource.toml",
    "/.devcontainer/",
    "/.github/",
    "/.gitignore",
    "/CLAUDE.md",
    "/REVIEW.md",
    "/docs/",
    "/rust-toolchain.toml",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
ndarray = { version = "0.17", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
rand = "0.10.2"
# Optional NIR (Neuromorphic Intermediate Representation) parameter export.
# `nir-rs` owns the `.nir` wire format, so this crate never links HDF5 itself:
# `nir-rs`'s own `hdf5` feature stays off here and is left to the consumer that
# actually needs to write a file.
nir-rs = { version = "0.4", optional = true, default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"], optional = true }

[dev-dependencies]
criterion = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# RON carries NaN/inf literals, which JSON cannot; used only to prove the
# Deserialize finiteness guards are reachable.
ron = "0.10"
ndarray = "0.17"

[features]
default = []
ndarray = ["dep:ndarray"]
# NIR parameter-graph export (`to_nir()`), built on the maintained `nir-rs`
# graph model. No native dependency and no HDF5: enable `nir-rs`'s own `hdf5`
# feature in the consuming application to serialize `.nir` files.
nir = ["dep:nir-rs"]
serde = ["dep:serde"]
wasm-js = ["dep:getrandom"]

[[example]]
name = "ndarray_encoding"
required-features = ["ndarray"]

[[example]]
name = "nir_export"
required-features = ["nir"]

[[bench]]
name = "encoders"
harness = false

[[bench]]
name = "allocations"
harness = false
