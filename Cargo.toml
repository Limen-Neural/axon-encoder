[package]
name = "axon-encoder"
version = "0.4.0"
# Kept for cargo metadata / CARGO_PKG_AUTHORS. crates.io UI lists the
# publishing account instead of this field (RFC 3052).
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
description = "Flexible sensory encoding pipelines for spiking neural networks — rate, temporal, predictive, population, and neuromodulator-driven encoding for telemetry and cyber-physical data."
repository = "https://github.com/Limen-Neural/axon-encoder"
documentation = "https://docs.rs/axon-encoder"
readme = "README.md"
license = "MIT OR Apache-2.0"
edition = "2024"
# Keep identical to rust-toolchain.toml `channel` and the CI workflow
# `toolchain:` pin (see REVIEW.md "MSRV pin rule").
rust-version = "1.98.1"
keywords = ["snn", "spiking", "neuromorphic", "encoding", "spike"]
categories = ["science", "algorithms", "simulation"]
# crates.io surface: keep licenses, README, sources, examples, and tests.
# Drop agent/CI/dev-only paths. Hidden git-tracked files still pack unless
# listed here (e.g. .gitignore). `cargo package` does not read .dockerignore.
exclude = [
    "/.codacy.yml",
    "/.codecov.yml",
    "/.deepsource.toml",
    "/.devcontainer/",
    "/.dockerignore",
    "/.github/",
    "/.gitignore",
    "/Dockerfile",
    "/REVIEW.md",
    "/docs/",
    "/rust-toolchain.toml",
]

[dependencies]
ndarray = { version = "0.16", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
rand = "0.10.2"

[dev-dependencies]
criterion = "0.8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.16"

[features]
default = []
ndarray = ["dep:ndarray"]
serde = ["dep:serde"]

[[example]]
name = "ndarray_encoding"
required-features = ["ndarray"]

[[bench]]
name = "encoders"
harness = false

[[bench]]
name = "allocations"
harness = false
