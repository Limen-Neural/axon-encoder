# Docker build + push (Docker Hub + GitHub Container Registry)
# Third-party Actions are pinned to immutable commit SHAs.
# Uses local Docker Buildx (no Build Cloud dependency).
#
# PR: verify build + load runtime image + run tests in builder stage
#     (contents: read only).
# main push: publish to Docker Hub + GHCR (packages: write only on that job).
name: Docker Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests: build & smoke-verify without package write.
  docker-verify:
    name: docker verify
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        # Dependabot PRs lack secrets; same-repo human PRs keep authenticated pulls.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image tags
        id: image
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "tags=axon-encoder:pr-${SHA}" >> "$GITHUB_OUTPUT"
          echo "verify_tag=axon-encoder:pr-${SHA}" >> "$GITHUB_OUTPUT"
          echo "builder_tag=axon-encoder:builder-pr-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build runtime image (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify runtime image contains example binaries
        run: |
          set -euo pipefail
          # Fail if no executables (bare `ls` succeeds on empty dir).
          out=$(docker run --rm "${{ steps.image.outputs.verify_tag }}" \
            sh -c 'ls -1 /usr/local/bin | wc -l')
          test "${out}" -ge 1
          # Known example binaries from examples/*.rs
          for bin in \
            delta_encoding \
            latency_encoding \
            ndarray_encoding \
            population_encoding \
            predictive_encoding \
            rate_encoding \
            sibling_gains_adapter \
            temporal_encoding
          do
            docker run --rm "${{ steps.image.outputs.verify_tag }}" \
              sh -c "test -x /usr/local/bin/${bin}"
          done
          docker run --rm "${{ steps.image.outputs.verify_tag }}" ls -la /usr/local/bin/

      - name: Build builder stage and run cargo tests
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          target: builder
          tags: ${{ steps.image.outputs.builder_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: cargo test --all-features --locked in builder image
        run: |
          set -euo pipefail
          docker run --rm "${{ steps.image.outputs.builder_tag }}" \
            cargo test --all-features --locked --quiet

  # main only: dual-push to Docker Hub + GHCR.
  docker-publish:
    name: docker publish
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set image tags
        id: image
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # Full match only: X.Y.Z. Use single-quoted ERE so `$` is end-of-string
          # (not shell-expanded). Do NOT write `\$` — that matches a literal `$`.
          if [ -z "${VER}" ] || ! printf '%s' "${VER}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Failed to extract a semver X.Y.Z from Cargo.toml (got: ${VER:-empty})"
            exit 1
          fi
          HUB="${{ vars.DOCKER_USER }}/axon-encoder"
          # GHCR owner must be lowercase
          GHCR="ghcr.io/limen-neural/axon-encoder"
          # Hub: commit SHA + version + latest
          # GHCR: same so the package appears under github.com/orgs/Limen-Neural/packages
          TAGS="${HUB}:${SHA},${HUB}:${VER},${HUB}:latest"
          TAGS="${TAGS},${GHCR}:${SHA},${GHCR}:${VER},${GHCR}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
