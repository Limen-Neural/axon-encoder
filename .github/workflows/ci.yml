# Third-party Actions are pinned to immutable commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Check wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install browser-WASM toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Check browser WASM build
        run: >-
          cargo +1.99.0 check --locked
          --target wasm32-unknown-unknown
          --no-default-features
          --features serde,wasm-js

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.99.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies
        run: cargo audit

  validate:
    name: Validate, Test & Doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # rust-version (true MSRV) is enforced by the `msrv` job and may be lower
      # than the dev-toolchain pin. rust-toolchain.toml channel, every literal
      # `toolchain:` pin (including this job's), and the devcontainer rust image
      # must all equal the dev pin, and rust-version must not exceed it
      # (REVIEW.md "MSRV vs dev-toolchain pin" — #123 / LIM-1571).
      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - name: Verify MSRV/dev-toolchain pins
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          # Numeric x.y.z compare: returns 0 when $1 <= $2.
          ver_le() {
            local IFS=.
            local -a a=($1) b=($2)
            local i
            for i in 0 1 2; do
              if [ "${a[i]:-0}" -lt "${b[i]:-0}" ]; then return 0; fi
              if [ "${a[i]:-0}" -gt "${b[i]:-0}" ]; then return 1; fi
            done
            return 0
          }
          if ! ver_le "$cargo_rv" "$toolchain_ch"; then
            echo "ERROR: rust-version=$cargo_rv must be <= toolchain channel=$toolchain_ch." >&2
            exit 1
          fi
          # Check every literal toolchain pin. The `msrv` job installs its
          # toolchain via rustup from Cargo.toml rust-version, so it has no
          # literal `toolchain:` line and is intentionally not matched here.
          for workflow in .github/workflows/ci.yml .github/workflows/coverage.yml; do
            pins=$(awk '/^[[:space:]]*toolchain:[[:space:]]*/ {
              sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
            }' "$workflow")
            if [ -z "$pins" ]; then
              echo "ERROR: No toolchain pins found in $workflow." >&2
              exit 1
            fi
            while IFS= read -r pin; do
              echo "$workflow toolchain=$pin"
              if [ "$pin" != "$toolchain_ch" ]; then
                echo "ERROR: $workflow toolchain must match rust-toolchain.toml channel=$toolchain_ch (got '$pin')." >&2
                exit 1
              fi
            done <<< "$pins"
            # Hard-coded `cargo +<ver>` invocations (e.g. the wasm check) must
            # use the dev pin too. `cargo +${{ ... }}` templates are skipped
            # because they do not start with a digit.
            cargo_pins=$(grep -oE 'cargo \+[0-9]+\.[0-9]+\.[0-9]+' "$workflow" | sed -E 's/.*\+//' | sort -u || true)
            while IFS= read -r cpin; do
              [ -z "$cpin" ] && continue
              echo "$workflow cargo +$cpin"
              if [ "$cpin" != "$toolchain_ch" ]; then
                echo "ERROR: $workflow cargo +$cpin must match toolchain channel=$toolchain_ch." >&2
                exit 1
              fi
            done <<< "$cargo_pins"
          done
          # The contributor devcontainer must track the same major.minor.patch.
          for df in .devcontainer/Dockerfile; do
            if [ -f "$df" ]; then
              # Do not let missing matches abort under pipefail before the ERROR.
              img=$(grep -m1 -E '^FROM[[:space:]]+rust:' "$df" 2>/dev/null | sed -E 's/.*rust:([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | tr -d '\r' || true)
              echo "$df rust image tag=${img:-<missing>}"
              if [ -z "$img" ] || [ "$img" != "$toolchain_ch" ]; then
                echo "ERROR: $df rust image tag must match toolchain channel=$toolchain_ch (got '${img:-<missing>}')." >&2
                exit 1
              fi
            fi
          done

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Compile benchmarks
        run: cargo bench --no-run

      - name: Run tests (default features)
        run: cargo test --locked

      - name: Run tests (serde feature)
        run: cargo test --features serde --locked

      # The `nir` feature is also covered by --all-features below; this row
      # names it explicitly so a failure is attributable to the feature.
      # It pulls only the pure-Rust `nir-rs` graph model: no HDF5, no native
      # libraries, so it runs on every matrix OS.
      - name: Run tests (nir feature)
        run: cargo test --features nir --locked

      - name: Run tests (all features)
        run: cargo test --all-features --locked

      - name: Verify documentation
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  # True-MSRV gate: installs exactly the rustc that Cargo.toml `rust-version`
  # declares and builds/tests the crate on it. Kept separate from the
  # dev-toolchain pin (1.99.0) so toolchain upgrades stop bumping the MSRV
  # (#123 / LIM-1571, parent Limen-Neural/neuromod#214).
  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msr
        shell: bash
        run: |
          set -euo pipefail
          msrv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '\r')
          echo "msrv=$msrv"
          echo "msr=$msrv" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install "${{ steps.msr.outputs.msr }}" --profile minimal

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2
        with:
          key: msrv-${{ steps.msr.outputs.msr }}

      # `nir` is excluded: it is gated by nir-rs's own rust-version (1.98.1 in
      # nir-rs 0.4.5), which is tracked separately (Limen-Neural/nir-rs#70).
      # `serde` and `ndarray` cover the optional in-crate features.
      - name: Check all targets on MSRV
        run: cargo +${{ steps.msr.outputs.msr }} check --locked --all-targets --features serde,ndarray

      - name: Test on MSRV
        run: cargo +${{ steps.msr.outputs.msr }} test --locked --features serde,ndarray
