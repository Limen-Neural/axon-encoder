# Third-party Actions are pinned to immutable commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate, Test & Doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Keep Cargo.toml rust-version, rust-toolchain.toml channel, and this
      # job's toolchain: string identical (MSRV single source of truth — #67).
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # shell: bash so the script runs on Windows runners too.
      - name: Verify MSRV pins agree
        shell: bash
        run: |
          set -euo pipefail
          strip_cr() { tr -d '\r'; }
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/' | strip_cr)
          # Extract from the "Install Rust" step only (not a later/earlier
          # dtolnay/rust-toolchain job). Strip CR for CRLF checkouts.
          # Cap scan so a missing toolchain: fails instead of wandering.
          ci_rv=$(awk '
            BEGIN { want = 0; in_rt = 0; lines = 0 }
            {
              sub(/\r$/, "")
            }
            /^[[:space:]]*- name:[[:space:]]*Install Rust/ { want = 1; next }
            want && /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
            in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
              sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
              exit 0
            }
            want {
              lines++
              if (lines > 20) exit 1
              if (/^[[:space:]]*- name:/) exit 1
            }
          ' .github/workflows/ci.yml) || true
          if [ -z "${ci_rv:-}" ]; then
            echo "ERROR: Failed to extract toolchain: from Install Rust step in .github/workflows/ci.yml" >&2
            exit 1
          fi
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          if [ "$cargo_rv" != "$toolchain_ch" ] || [ "$cargo_rv" != "$ci_rv" ]; then
            echo "ERROR: MSRV pins disagree (must be identical)." >&2
            exit 1
          fi
          # Docker / Dev Container images must track the same major.minor.patch.
          for df in Dockerfile .devcontainer/Dockerfile; do
            if [ -f "$df" ]; then
              # Do not let missing matches abort under pipefail before the ERROR.
              img=$(grep -m1 -E '^FROM[[:space:]]+rust:' "$df" 2>/dev/null | sed -E 's/.*rust:([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | tr -d '\r' || true)
              echo "$df rust image tag=${img:-<missing>}"
              if [ -z "$img" ] || [ "$img" != "$cargo_rv" ]; then
                echo "ERROR: $df rust image tag must match rust-version=$cargo_rv (got '${img:-<missing>}')." >&2
                exit 1
              fi
            fi
          done

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (default features)
        run: cargo test --locked

      - name: Run tests (serde feature)
        run: cargo test --features serde --locked

      - name: Run tests (all features)
        run: cargo test --all-features --locked

      - name: Verify documentation
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features
