# Third-party Actions are pinned to immutable commit SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate, Test & Doc (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Keep Cargo.toml rust-version, rust-toolchain.toml channel, and this
      # job's toolchain: string identical (MSRV single source of truth — #67).
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # shell: bash so the awk script runs on Windows runners too.
      - name: Verify MSRV pins agree
        shell: bash
        run: |
          set -euo pipefail
          cargo_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          toolchain_ch=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          # Extract from the Install Rust step's `toolchain:` input (not a hardcoded mirror).
          ci_rv=$(awk '
            /uses: dtolnay\/rust-toolchain@/ { in_rt = 1; next }
            in_rt && /^[[:space:]]*toolchain:[[:space:]]*/ {
              sub(/^[[:space:]]*toolchain:[[:space:]]*/, "")
              sub(/[[:space:]]*$/, "")
              print
              exit
            }
            in_rt && /^[[:space:]]*- name:/ { exit }
          ' .github/workflows/ci.yml)
          test -n "$ci_rv"
          echo "Cargo.toml rust-version=$cargo_rv"
          echo "rust-toolchain.toml channel=$toolchain_ch"
          echo "ci.yml pin=$ci_rv"
          test "$cargo_rv" = "$toolchain_ch"
          test "$cargo_rv" = "$ci_rv"

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests (default features)
        run: cargo test --locked

      - name: Run tests (all features)
        run: cargo test --all-features --locked

      - name: Verify documentation
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features
